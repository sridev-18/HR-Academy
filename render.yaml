services:
  - type: web
    name: hr-square-academy
    runtime: static
    branch: main
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true

    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data: https://hrsquareacademy.in; media-src 'self'; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 https://hr-square-reviews.onrender.com; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://wa.me; base-uri 'self'; upgrade-insecure-requests;"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), screen-wake-lock=(), accelerometer=(), gyroscope=(), magnetometer=()"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains; preload"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /css/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /js/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: hr-square-reviews
    runtime: python
    rootDir: review-api
    buildCommand: "pip install -r requirements.txt && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "hr-square-reviews.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hr-square-academy.onrender.com,http://localhost:5500,http://127.0.0.1:5500"
      - key: DATABASE_URL
        sync: false
