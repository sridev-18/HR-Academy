services:
  - type: web
    name: hr-square-academy
    runtime: static
    branch: main
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true

    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data: https://hrsquareacademy.in; media-src 'self'; connect-src 'self'; frame-ancestors 'self'; form-action 'self' https://wa.me; base-uri 'self'; upgrade-insecure-requests;"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /css/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /js/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
